# Maximum Independent Set on Watts–Strogatz small-world graphs, GraphSAGE + PPO.
base: base.yaml

run_name: mis_ppo

generator:
  type: watts_strogatz
  num_nodes: [40, 60]
  k: 6
  p: 0.1
  weighted: false

env:
  type: mis

algo:
  type: ppo
  gamma: 0.99
  gae_lambda: 0.95
  lr: 0.0003
  ppo_epochs: 4
  minibatch_size: 512
  model:
    encoder:
      type: graphsage
      hidden_dim: 64
      num_layers: 3
    actor: {type: actor}
    critic: {type: critic}

trainer:
  num_envs: 64
  iterations: 3000
  baselines: [degree, random]
