# SHEAR — high-value critical-EDGE attack sequence. Edge removal = node removal on the
# line graph L(G); pairwise-connectivity ANC measured on the ORIGINAL graph. Reuses the
# line-graph transform + FINDER bilinear head + n-step DQN.
base: base.yaml
run_name: shear
generator: {type: line_graph, base: {type: barabasi_albert, num_nodes: [30, 50], m: 3}}
env: {type: edge_dismantling, metric: pairwise}
algo:
  type: dqn
  n_step: 5
  double: false
  gamma: 1.0
  learn_start: 2000
  model:
    encoder: {type: graphsage, hidden_dim: 64, num_layers: 3, aggr: sum}
    head: {type: finder_q, aux_dim: 0}
  buffer: {type: nstep_replay, capacity: 100000}
trainer: {num_envs: 16, iterations: 5000, eval_every: 300, baselines: [random]}
